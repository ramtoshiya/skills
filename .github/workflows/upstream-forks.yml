name: Upstream fork drift
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: upstream-fork-drift
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/upstream-forks.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
