name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: '2026.10.17'
          cache: false
          install_args: '--locked'
      - name: Install background-tools test dependencies
        run: mise exec -- npm ci --omit=dev --ignore-scripts --no-audit
        working-directory: bb-plugins/background-tools
      - run: mise exec -- npm test
      - run: mise exec -- npm ci --ignore-scripts
        working-directory: tools/excalidraw-web-export
      - run: mise exec -- npm test
        working-directory: tools/excalidraw-web-export
