name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.10.17'
          cache: false
          install_args: '--locked'
      - run: mise exec -- npm test
      - run: mise exec -- npm ci --ignore-scripts
        working-directory: tools/excalidraw-web-export
      - run: mise exec -- npm test
        working-directory: tools/excalidraw-web-export
