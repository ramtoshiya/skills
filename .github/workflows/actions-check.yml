name: Actions checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.10.17'
          cache: false
          install_args: '--locked'
      - name: Test analyzer failure reporting
        run: mise exec -- node --test dev/tests/repository/actions-checks.mjs
      - name: Check syntax and contracts
        run: mise run actions:syntax
      - name: Check security
        if: ${{ !cancelled() }}
        run: mise run actions:security
