[tools]
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.31.1"
go = "1.27.4"
node = "24.22.2"
uv = "0.13.7"

[tasks."actions:syntax"]
description = "Check GitHub Actions syntax, schemas, and contracts"
run = "actionlint"

[tasks."actions:security"]
description = "Audit GitHub Actions security without network access or credentials"
run = "env -u GH_TOKEN -u GITHUB_TOKEN -u ZIZMOR_GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN -u RUST_LOG zizmor --offline --strict-collection .github/workflows"

[tasks."actions:check"]
description = "Run GitHub Actions syntax and security checks"
depends = ["actions:syntax", "actions:security"]

[bootstrap.packages]
"brew:jq" = "latest"
"brew:uv" = "latest"
"brew:zsh-autosuggestions" = "latest"

[bootstrap.mise_shell_activate]
zsh = true

[dotfiles]
"~/.config/shell/environment.zsh" = { source = "setup/shell/environment.zsh", mode = "copy" }
"~/.config/shell/interactive.zsh" = { source = "setup/shell/interactive.zsh", mode = "copy" }
"~/.zshenv/shell" = { block = 'source "$HOME/.config/shell/environment.zsh"' }
"~/.zshrc/shell" = { block = 'source "$HOME/.config/shell/interactive.zsh"' }

"~/.npmrc/release-age" = { line = "min-release-age=3" }
"~/Library/Preferences/pnpm/config.yaml/release-age" = { source = "setup/packages/pnpm.yaml", merge = true }
"~/.config/uv/uv.toml/release-age" = { source = "setup/packages/uv.toml", merge = true }
"~/.config/mise/config.toml/release-age" = { source = "setup/packages/mise-settings.toml", merge = true }

"~/.config/git/shared.gitconfig" = { source = "setup/git/shared.gitconfig", mode = "copy" }
"~/.config/git/undo-notice.py" = { source = "setup/git/undo-notice.py", mode = "copy" }
"~/.gitconfig/shared" = { block = '''
[include]
    path = ~/.config/git/shared.gitconfig
''' }
"~/.gitignore/ds-store" = { line = ".DS_Store" }
"~/.gitignore/claude-local-settings" = { line = "**/.claude/settings.local.json" }

"~/.bb/AGENTS.md" = { source = "setup/agents/bb-agents.md", mode = "copy" }
"~/.claude/status-line.sh" = { source = "setup/agents/claude-statusline.sh", mode = "copy" }
"~/.local/bin/claude-review" = { source = "setup/agents/claude-review", mode = "copy" }
"~/.local/share/claude-review/claude-review.py" = { source = "setup/agents/claude-review.py", mode = "copy" }
"~/.local/bin/quotio-cli" = { source = "setup/agents/quotio-cli", mode = "copy" }

[tasks.bootstrap]
depends = ["agents:settings:sync"]

[tasks."main:status"]
description = "Compare origin/main, the shared checkout's main, and every install, and exit 1 on a gap"
run = "uv run --offline --no-project --managed-python --python '>=3.11' --no-config --exclude-newer '3 days' python -I setup/agents/level.py status"

[tasks."main:sync"]
description = "Bring the shared checkout's main level with origin/main, then install from it"
run = "uv run --offline --no-project --managed-python --python '>=3.11' --no-config --exclude-newer '3 days' python -I setup/agents/level.py sync"

[tasks."main:ci"]
description = "Report GitHub Actions results for a specific push to main"
run = "uv run --offline --no-project --managed-python --python '>=3.11' --no-config --exclude-newer '3 days' python -I setup/agents/level.py ci"

[tasks."upstream-updates:automation"]
description = "Create or update the daily bb automation that updates third-party skills"
run = "node dev/automation/upstream-updates/updates.mjs install"

[tasks."agents:status"]
description = "Compare installed agent packages with this checkout"
run = "uv run --offline --no-project --managed-python --python '>=3.11' --no-config --exclude-newer '3 days' python -I setup/agents/sync.py status"

[tasks."hooks:build"]
description = "Build the hook binary from its Go source"
run = "uv run --offline --no-project --managed-python --python '>=3.11' --no-config --exclude-newer '3 days' python -I setup/agents/hook_binary.py build"

[tasks."agents:sync"]
description = "Reconcile managed packages across installed agents"
run = "uv run --offline --no-project --managed-python --python '>=3.11' --no-config --exclude-newer '3 days' python -I setup/agents/sync.py sync"

[tasks."agents:settings:status"]
description = "Compare registered Claude settings and instructions with this checkout"
run = "uv run --offline --no-project --managed-python --python '>=3.11' --no-config --exclude-newer '3 days' python -I setup/agents/sync.py status --settings-only"

[tasks."agents:settings:sync"]
description = "Reconcile registered Claude settings and instructions"
run = "uv run --offline --no-project --managed-python --python '>=3.11' --no-config --exclude-newer '3 days' python -I setup/agents/sync.py sync --settings-only"

[tasks."takeaturn:install"]
description = "Install the takeaturn CLI at the commit pinned in setup/agents/takeaturn.py"
run = "uv run --offline --no-project --managed-python --python '>=3.11' --no-config --exclude-newer '3 days' python -I setup/agents/takeaturn.py install"
