<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plugin update review</title>
<style>
:root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
body { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
section { border: 1px solid #8888; border-radius: .5rem; padding: 1rem; margin: 1rem 0; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: .8rem; background: #8882; max-height: 36rem; overflow: auto; }
code { overflow-wrap: anywhere; } button { padding: .5rem .8rem; margin: .3rem .4rem .3rem 0; cursor: pointer; }
.warning { color: #c36a00; font-weight: bold; } .error { color: #dc5454; }
small { opacity: .8; } dt { font-weight: bold; } dd { margin: 0 0 .5rem; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header><div><h1>Plugin update review</h1><p>Inspect each candidate before running tests or applying it.</p></div><button id="refresh">Refresh</button></header>
<p id="message" role="status"></p><main id="sources"></main>
<script>
const token = __TOKEN__;
const message = document.getElementById('message');
const sources = document.getElementById('sources');
function el(tag, text, parent) { const node = document.createElement(tag); if (text !== undefined) node.textContent = text; if (parent) parent.appendChild(node); return node; }
function field(list, label, value) { el('dt', label, list); el('dd', String(value ?? 'Unavailable'), list); }
async function action(path, payload) {
  message.textContent = 'Working…';
  try {
    const response = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json','X-Review-Token':token}, body:JSON.stringify(payload)});
    const result = await response.json();
    message.textContent = result.error || result.message;
    await refresh();
  } catch (error) { message.textContent = String(error); }
}
async function refresh() {
  try {
    const response = await fetch('/api/state', {headers:{'X-Review-Token':token}});
    if (!response.ok) throw Error('The review server is unavailable.');
    const data = await response.json();
    sources.replaceChildren();
    for (const source of data.sources) {
      const section = el('section', undefined, sources); el('h2', source.label, section);
      if (source.problem) { const problem = el('p', source.problem, section); problem.className = 'error'; }
      const candidate = source.candidate;
      if (!candidate) { el('p', 'No pending candidate.', section); continue; }
      const list = el('dl', undefined, section);
      field(list, 'Status', candidate.complete ? 'Application complete' : candidate.status);
      field(list, 'Candidate revision', candidate.head);
      field(list, 'Original fork revision', candidate.fork_head);
      field(list, 'Upstream revision', candidate.upstream_head);
      field(list, 'Prior marketplace pins', Object.entries(candidate.prior_pins).map(([name, sha]) => `${name}: ${sha}`).join('\n'));
      field(list, 'Worktree', candidate.worktree);
      field(list, 'Prepared', candidate.prepared_at || candidate.created_at);
      if (candidate.error) field(list, 'Error', candidate.error);
      if (candidate.conflicts?.length) field(list, 'Conflicts', candidate.conflicts.join('\n'));
      if (candidate.worktree_status) field(list, 'Worktree changes', candidate.worktree_status);
      if (candidate.apply?.status) field(list, 'Application', JSON.stringify(candidate.apply, null, 2));
      const detail = el('details', undefined, section); el('summary', 'Changes since each marketplace pin and worktree changes', detail);
      if (source.diff?.truncated) { const warning = el('p', 'Diff truncated at 500,000 characters. Inspect the worktree for the full diff.', detail); warning.className = 'warning'; }
      el('pre', source.diff?.text || 'No diff available.', detail);
      el('h3', 'Tests', section);
      if (!source.tests.length) el('p', 'No tests registered.', section);
      for (const test of source.tests) {
        const button = el('button', `${test.label} (${test.kind})`, section);
        button.disabled = candidate.complete || candidate.status !== 'ready';
        button.onclick = () => action('/api/test', {source:source.id, test:test.id, head:candidate.head});
      }
      if (!candidate.tests?.length) el('p', 'Not run.', section);
      for (const test of candidate.tests || []) el('p', `${test.label}: ${test.status}${test.exit_code === undefined ? '' : ` (exit ${test.exit_code})`} · revision ${test.head} · log ${test.log}`, section);
      const apply = el('button', candidate.apply?.status === 'failed' ? 'Retry application' : 'Apply this revision', section);
      apply.disabled = candidate.complete || candidate.status !== 'ready';
      apply.onclick = () => { if (confirm(`Publish ${candidate.head}, update marketplace pins, and run configured installation targets?`)) action('/api/apply', {source:source.id, head:candidate.head}); };
      el('small', ' Tests are optional. Applying may publish changes and run the configured installation commands.', section);
    }
  } catch (error) { message.textContent = String(error); }
}
document.getElementById('refresh').onclick = refresh;
refresh();
</script>
</body></html>
